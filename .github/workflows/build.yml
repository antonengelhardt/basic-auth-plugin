name: Build basic-auth-plugin

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - "CODEOWNERS"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust with wasm32-wasip1
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: true

      - name: Build basic-auth-plugin
        run: cargo build --target wasm32-wasip1 --release

      - name: Upload plugin as artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: target/wasm32-wasip1/release/basic_auth_plugin.wasm

  ghcr-image:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/antonengelhardt/basic-auth-plugin:latest
          cache-from: type=registry,ref=ghcr.io/antonengelhardt/basic-auth-plugin:latest
          cache-to: type=inline
